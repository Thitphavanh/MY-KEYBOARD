{% extends "base.html" %}
{% block title %}ຢືນຢັນອີເມວ — NexByte Computer{% endblock %}
{% block content %}

<div class="form-wrap" style="margin-top:56px;">
  <div class="form-card">
    <div class="auth-tabs">
      <span data-i18n="otp_title"></span>
    </div>

    <p style="font-size:13px; color:var(--text-dim); margin-bottom:16px;">
      <span data-i18n="otp_sent_to"></span> <b>{{ email }}</b>
    </p>

    {% if error %}
    <div class="form-msg show error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label data-i18n="otp_label"></label>
        <input type="text" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-i18n-ph="otp_ph" required autofocus>
      </div>
      <button type="submit" class="btn btn-solid btn-block"><span data-i18n="otp_cta"></span><span class="ic" data-ic="arrowRight"></span></button>
    </form>
    <form method="post" style="margin-top:10px;">
      {% csrf_token %}
      <button type="submit" name="resend" value="1" class="btn btn-ghost btn-block" style="font-size:12.5px;" data-i18n="otp_resend"></button>
    </form>
  </div>
</div>

{% endblock %}
{% block extra_scripts %}
<script>fillIcons();</script>
{% endblock %}
