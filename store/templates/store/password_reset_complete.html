{% extends "base.html" %}
{% block title %}ຕັ້ງລະຫັດຜ່ານສຳເລັດ — {{ site_settings.store_name }}{% endblock %}
{% block content %}

<div class="form-wrap" style="margin-top:56px;">
  <div class="form-card" style="text-align:center;">
    <div style="width:60px; height:60px; border-radius:50%; background:rgba(34,197,94,0.15); color:#22c55e; display:inline-flex; align-items:center; justify-content:center; margin-bottom:18px; font-size:24px;">
      <span class="ic" data-ic="check"></span>
    </div>
    <h2 style="margin-bottom:10px;">ຕັ້ງລະຫັດຜ່ານໃໝ່ສຳເລັດແລ້ວ</h2>
    <p class="sub">ທ່ານສາມາດເຂົ້າສູ່ລະບົບດ້ວຍລະຫັດຜ່ານໃໝ່ໄດ້ເລີຍ</p>
    <a href="{% url 'login' %}" class="btn btn-solid btn-block" style="margin-top:20px;">ເຂົ້າສູ່ລະບົບ</a>
  </div>
</div>

{% endblock %}
{% block extra_scripts %}
<script>fillIcons();</script>
{% endblock %}
